version: 2
customFilters:
  filter: >
    .runs |= map(
      if (.name != null and (.name | test("(?i)cross.?site scripting|xss"))) 
      then . 
      else empty 
      end
    )
  pass: >
    [.runs[] | select(.name != null and (.name | test("(?i)cross.?site scripting|xss")))] 
    | length
  msg: "⚠️ Cross-site Scripting (XSS) vulnerabilities found"
